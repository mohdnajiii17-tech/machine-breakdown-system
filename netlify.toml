[build]
  base = "."
  command = "npm run build:frontend"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["backend/**"]

# API requests route to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# Single Page App routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
